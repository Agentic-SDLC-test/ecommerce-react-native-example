name: CI

on:
  push:
    branches:
      - main
      - temp_main
      - temp_main_2
  pull_request:
    branches:
      - main
      - temp_main
      - temp_main_2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mock-server dependencies
        run: npm ci --prefix mock-server

      - name: Test
        run: npm test -- --ci

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # create the tag and release
      packages: write # publish the build record package
      id-token: write # sign the build provenance attestation
      attestations: write
      artifact-metadata: write # linked artifacts storage record
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Authenticate with EAS
        run: |
          # EAS CLI automatically uses EXPO_TOKEN environment variable
          eas whoami || {
            echo "Failed to authenticate with EAS. Please check EXPO_TOKEN secret."
            exit 1
          }
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app
        id: build
        run: |
          echo "Starting EAS build: eas build --platform android --profile staging --non-interactive --json"
          BUILD_OUTPUT_FILE="eas-build-output.json"

          # With --json the structured result goes to stdout while progress logs go to stderr,
          # so redirecting stdout captures clean JSON we can both archive and parse.
          eas build --platform android --profile staging --non-interactive --json > "$BUILD_OUTPUT_FILE" || {
            echo "EAS build command failed. Captured output:"
            cat "$BUILD_OUTPUT_FILE" || true
            exit 1
          }

          echo "Raw EAS build output:"
          cat "$BUILD_OUTPUT_FILE"
          echo ""

          # eas build --json returns an array of build objects.
          if jq '.' "$BUILD_OUTPUT_FILE" > /dev/null 2>&1; then
            APP_VERSION=$(jq -r '.[0].appVersion // "unknown"' "$BUILD_OUTPUT_FILE")
            BUILD_VERSION=$(jq -r '.[0].appBuildVersion // "unknown"' "$BUILD_OUTPUT_FILE")
            BUILD_ID=$(jq -r '.[0].id // "unknown"' "$BUILD_OUTPUT_FILE")
            # Prefer the direct application archive URL, fall back to the build page artifact URL.
            BUILD_URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // ""' "$BUILD_OUTPUT_FILE")
          else
            echo "Warning: EAS build output is not valid JSON; cannot parse artifact URL."
            APP_VERSION="unknown"; BUILD_VERSION="unknown"; BUILD_ID="unknown"; BUILD_URL=""
          fi

          echo "App version : $APP_VERSION"
          echo "Build number: $BUILD_VERSION"
          echo "Build ID    : $BUILD_ID"
          echo "Artifact URL: $BUILD_URL"

          {
            echo "app_version=$APP_VERSION"
            echo "build_version=$BUILD_VERSION"
            echo "build_id=$BUILD_ID"
            echo "build_url=$BUILD_URL"
          } >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download Android build artifact (.apk)
        id: download
        if: steps.build.outputs.build_url != ''
        run: |
          BUILD_URL="${{ steps.build.outputs.build_url }}"
          APP_VERSION="${{ steps.build.outputs.app_version }}"
          BUILD_VERSION="${{ steps.build.outputs.build_version }}"

          mkdir -p build-artifacts

          # Descriptive name, e.g. EasyBuy_staging_1_0_0_42.apk
          VERSION_UNDERSCORE=$(echo "$APP_VERSION" | tr '.' '_')
          APK_FILENAME="EasyBuy_staging_${VERSION_UNDERSCORE}_${BUILD_VERSION}.apk"
          APK_FILE="build-artifacts/${APK_FILENAME}"

          echo "Downloading build artifact from: $BUILD_URL"
          curl -fL "$BUILD_URL" -o "$APK_FILE" || {
            echo "Failed to download build artifact from $BUILD_URL"
            exit 1
          }

          echo "Downloaded $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Export resolved app/EAS configuration
        id: config
        if: always()
        run: |
          echo "Exporting configuration: eas config --platform android --profile staging --non-interactive --json"
          # Combines app.json (Expo config) and eas.json (build profile) into one resolved JSON document.
          eas config --platform android --profile staging --non-interactive --json > eas-config.json || {
            echo "eas config command failed. Captured output:"
            cat eas-config.json || true
            exit 1
          }
          echo "Resolved configuration:"
          cat eas-config.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # The binary is built and hosted by EAS, which deletes artifacts after 90 days.
      # Everything below turns that external build into a durable, linkable record:
      # a versioned build record package, a tagged release holding the archived
      # binary, and a storage record pointing back at expo.dev. It all runs only
      # when the PUBLISH_BUILDS repository variable is set to "yes", matching the
      # same switch in bitbucket-pipelines.yml.
      - name: Generate build record
        if: vars.PUBLISH_BUILDS == 'yes'
        run: |
          PACKAGE_SCOPE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          node scripts/eas-build-manifest.mjs \
            --build-output eas-build-output.json \
            --eas-config eas-config.json \
            ${APK_FILE:+--apk "$APK_FILE"} \
            --platform android \
            --profile staging \
            --provider github-actions \
            --commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --package-name "@$PACKAGE_SCOPE/easybuy-android-build" \
            --package-registry "https://npm.pkg.github.com"

          echo "Build record:"
          cat build-manifest.json
        env:
          APK_FILE: ${{ steps.download.outputs.apk_file }}

      # Writes the authenticated .npmrc for GitHub Packages; the registry itself is
      # pinned by publishConfig in the generated package.
      - name: Authenticate npm with GitHub Packages
        if: vars.PUBLISH_BUILDS == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Publish build record to GitHub Packages
        if: vars.PUBLISH_BUILDS == 'yes'
        working-directory: build-record-package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest provenance of the archived artifact
        if: vars.PUBLISH_BUILDS == 'yes' && steps.download.outputs.apk_file != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.download.outputs.apk_file }}

      - name: Create tag and release
        if: vars.PUBLISH_BUILDS == 'yes'
        run: |
          . ./build-record.env

          # Draft first, attach every asset, then publish. Immutable releases lock
          # assets and the tag at publish time, so nothing may be added afterwards.
          gh release create "$BUILD_RECORD_TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Android $APP_PROFILE $BUILD_RECORD_VERSION" \
            --notes-file RELEASE_NOTES.md

          gh release upload "$BUILD_RECORD_TAG" \
            build-manifest.json eas-build-output.json eas-config.json --clobber

          if [ -n "$ARCHIVED_ARTIFACT_FILE" ]; then
            gh release upload "$BUILD_RECORD_TAG" "build-artifacts/$ARCHIVED_ARTIFACT_FILE" --clobber
          fi

          gh release edit "$BUILD_RECORD_TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the expo.dev artifact on the linked artifacts page
        if: vars.PUBLISH_BUILDS == 'yes' && steps.download.outputs.apk_file != ''
        run: |
          . ./build-record.env

          # expo.dev is the external registry holding the real binary; the digest
          # matches the attestation above, so provenance resolves automatically.
          jq -n \
            --arg name "easybuy-$APP_PLATFORM-$APP_PROFILE" \
            --arg version "$BUILD_RECORD_VERSION" \
            --arg digest "$ARCHIVED_ARTIFACT_DIGEST" \
            --arg artifact_url "$EAS_ARTIFACT_URL" \
            --arg repository "$EAS_PROJECT_SLUG" \
            --arg github_repository "${{ github.event.repository.name }}" \
            '{
              name: $name,
              version: $version,
              digest: $digest,
              artifact_url: $artifact_url,
              registry_url: "https://expo.dev/",
              repository: $repository,
              github_repository: $github_repository,
              status: "active"
            }' > storage-record.json

          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "orgs/${{ github.repository_owner }}/artifacts/metadata/storage-record" \
            --input storage-record.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs even when a step above failed, so a broken build still leaves its
      # outputs behind for debugging. The release is the durable copy; this is not.
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-android-staging-build
          path: |
            eas-build-output.json
            eas-config.json
            build-manifest.json
            build-artifacts/*.apk
          retention-days: 90
          if-no-files-found: warn
